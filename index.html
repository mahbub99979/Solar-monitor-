<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solar Monitor">
<title>Solar Monitor</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg:        #0a0f1e;
    --surface:   #111827;
    --border:    #1e2d45;
    --solar:     #f59e0b;
    --load:      #ef4444;
    --batt:      #3b82f6;
    --soc-high:  #22c55e;
    --soc-mid:   #f59e0b;
    --soc-low:   #ef4444;
    --text:      #f1f5f9;
    --muted:     #64748b;
    --power:     #a855f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--solar), #f97316);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .logo-sub  { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }

  .status-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
  }
  .dot.online  { background: var(--soc-high); box-shadow: 0 0 6px var(--soc-high); animation: pulse 2s infinite; }
  .dot.offline { background: var(--load); }

  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  /* ── Main ── */
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  /* ── SOC Ring ── */
  .soc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ring-wrap { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
  .ring-svg { width: 110px; height: 110px; transform: rotate(-90deg); }
  .ring-bg   { fill: none; stroke: var(--border); stroke-width: 8; }
  .ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease, stroke 0.5s; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-val  { font-size: 26px; font-weight: 700; font-family: 'Space Mono', monospace; line-height: 1; }
  .ring-unit { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .soc-info { flex: 1; }
  .soc-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .soc-status { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .soc-bar-wrap { background: var(--bg); border-radius: 6px; height: 6px; overflow: hidden; }
  .soc-bar { height: 100%; border-radius: 6px; transition: width 0.8s ease, background 0.5s; }

  /* ── Grid Cards ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .card.solar::before { background: var(--solar); }
  .card.load::before  { background: var(--load); }
  .card.batt::before  { background: var(--batt); }
  .card.power::before { background: var(--power); }

  .card-icon { font-size: 22px; margin-bottom: 8px; }
  .card-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .card-val {
    font-size: 28px; font-weight: 700;
    font-family: 'Space Mono', monospace;
    line-height: 1;
  }
  .card-unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.solar .card-val { color: var(--solar); }
  .card.load  .card-val { color: var(--load); }
  .card.batt  .card-val { color: var(--batt); }
  .card.power .card-val { color: var(--power); }

  /* ── Net Flow ── */
  .flow-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
  }
  .flow-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .flow-row   { display: flex; align-items: center; justify-content: space-between; }
  .flow-item  { text-align: center; flex: 1; }
  .flow-icon  { font-size: 24px; margin-bottom: 4px; }
  .flow-name  { font-size: 10px; color: var(--muted); }
  .flow-arrow {
    font-size: 20px;
    color: var(--muted);
    flex: 0 0 30px;
    text-align: center;
    transition: color 0.4s;
  }
  .flow-arrow.charging  { color: var(--soc-high); }
  .flow-arrow.draining  { color: var(--load); transform: scaleX(-1); }
  .flow-net {
    text-align: center;
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  /* ── Timestamp ── */
  .timestamp {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    padding-bottom: 8px;
  }

  /* ── Connection overlay ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,15,30,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    z-index: 99;
    transition: opacity 0.5s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-icon { font-size: 48px; }
  .overlay-text { font-size: 14px; color: var(--muted); }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--solar);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="overlay-icon">☀️</div>
  <div class="spinner"></div>
  <div class="overlay-text">Connecting to Solar Monitor…</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">☀️</div>
    <div>
      <div class="logo-text">Solar Monitor</div>
      <div class="logo-sub">12V LiFePO4 · 50Ah</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Connecting</span>
  </div>
</header>

<main>

  <!-- SOC Ring -->
  <div class="soc-card">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 110 110">
        <circle class="ring-bg"   cx="55" cy="55" r="46"/>
        <circle class="ring-fill" cx="55" cy="55" r="46" id="ringFill"
          stroke="#22c55e"
          stroke-dasharray="289"
          stroke-dashoffset="289"/>
      </svg>
      <div class="ring-center">
        <div class="ring-val" id="socVal">--</div>
        <div class="ring-unit">SOC %</div>
      </div>
    </div>
    <div class="soc-info">
      <div class="soc-label">Battery State</div>
      <div class="soc-status" id="socStatus">Waiting…</div>
      <div class="soc-bar-wrap">
        <div class="soc-bar" id="socBar" style="width:0%;background:var(--soc-high)"></div>
      </div>
    </div>
  </div>

  <!-- 4 metric cards -->
  <div class="grid">
    <div class="card solar">
      <div class="card-icon">🔆</div>
      <div class="card-label">Solar Input</div>
      <div class="card-val" id="solarI">--</div>
      <div class="card-unit">Ampere</div>
    </div>
    <div class="card load">
      <div class="card-icon">💡</div>
      <div class="card-label">Load</div>
      <div class="card-val" id="loadI">--</div>
      <div class="card-unit">Ampere</div>
    </div>
    <div class="card batt">
      <div class="card-icon">🔋</div>
      <div class="card-label">Battery</div>
      <div class="card-val" id="battV">--</div>
      <div class="card-unit">Volt</div>
    </div>
    <div class="card power">
      <div class="card-icon">⚡</div>
      <div class="card-label">Power</div>
      <div class="card-val" id="power">--</div>
      <div class="card-unit">Watt</div>
    </div>
  </div>

  <!-- Net Flow -->
  <div class="flow-card">
    <div class="flow-label">Energy Flow</div>
    <div class="flow-row">
      <div class="flow-item">
        <div class="flow-icon">☀️</div>
        <div class="flow-name">Solar</div>
      </div>
      <div class="flow-arrow" id="flowArrow">→</div>
      <div class="flow-item">
        <div class="flow-icon">🔋</div>
        <div class="flow-name">Battery</div>
      </div>
      <div class="flow-arrow" id="flowArrow2">→</div>
      <div class="flow-item">
        <div class="flow-icon">🏠</div>
        <div class="flow-name">Load</div>
      </div>
    </div>
    <div class="flow-net" id="flowNet">Net: -- A</div>
  </div>

  <div class="timestamp" id="timestamp">Last update: --</div>

</main>

<!-- Paho MQTT via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script>
// ── MQTT Config ──
const BROKER   = "d9df41c1d8054fe2acc6d306c95de264.s1.eu.hivemq.cloud";
const PORT     = 8884; // WebSocket SSL port for HiveMQ Cloud
const TOPIC    = "solar/data";
const USER     = "mahbub99979";
const PASS     = "01407891240mnoP";
const CLIENT   = "pwa_" + Math.random().toString(36).substr(2,6);

const overlay    = document.getElementById('overlay');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let client;
let connected = false;
let lastMsgTime = 0;
let watchdog;

function setStatus(state) {
  statusDot.className  = 'dot ' + state;
  statusText.textContent = state === 'online' ? 'Live' : state === 'offline' ? 'Offline' : 'Connecting';
}

function connect() {
  client = new Paho.MQTT.Client(BROKER, PORT, "/mqtt", CLIENT);

  client.onConnectionLost = (r) => {
    connected = false;
    setStatus('offline');
    setTimeout(connect, 5000);
  };

  client.onMessageArrived = (msg) => {
    try {
      const d = JSON.parse(msg.payloadString);
      updateUI(d);
      lastMsgTime = Date.now();
      if (!connected) {
        connected = true;
        overlay.classList.add('hidden');
        setStatus('online');
      }
    } catch(e) { console.warn("Parse error", e); }
  };

  client.connect({
    useSSL: true,
    userName: USER,
    password: PASS,
    keepAliveInterval: 30,
    onSuccess: () => {
      client.subscribe(TOPIC);
      setStatus('online');
    },
    onFailure: (e) => {
      setStatus('offline');
      setTimeout(connect, 5000);
    }
  });
}

// ── UI Update ──
const CIRC = 2 * Math.PI * 46; // ~289

function updateUI(d) {
  const si  = parseFloat(d.si  || 0);
  const li  = parseFloat(d.li  || 0);
  const bv  = parseFloat(d.bv  || 0);
  const soc = parseFloat(d.soc || 0);
  const pw  = parseFloat(d.pw  || 0);

  // Cards
  document.getElementById('solarI').textContent = si.toFixed(2);
  document.getElementById('loadI').textContent  = li.toFixed(2);
  document.getElementById('battV').textContent  = bv.toFixed(2);
  document.getElementById('power').textContent  = pw.toFixed(1);

  // SOC Ring
  const pct    = Math.min(Math.max(soc, 0), 100);
  const offset = CIRC * (1 - pct / 100);
  const ring   = document.getElementById('ringFill');
  const color  = pct > 60 ? 'var(--soc-high)' : pct > 25 ? 'var(--soc-mid)' : 'var(--soc-low)';
  ring.style.strokeDasharray  = CIRC;
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = color;

  document.getElementById('socVal').textContent = Math.round(pct);
  document.getElementById('socBar').style.width      = pct + '%';
  document.getElementById('socBar').style.background = color;

  const label = pct > 80 ? '🟢 Excellent' : pct > 60 ? '🟢 Good' : pct > 40 ? '🟡 Normal' : pct > 20 ? '🟠 Low' : '🔴 Critical';
  document.getElementById('socStatus').textContent = label;

  // Flow
  const net = si - li;
  const fa  = document.getElementById('flowArrow');
  const fa2 = document.getElementById('flowArrow2');
  if (net > 0.1) {
    fa.textContent  = '→';
    fa2.textContent = '→';
    fa.className    = 'flow-arrow charging';
    fa2.className   = 'flow-arrow';
    document.getElementById('flowNet').textContent = `⚡ Charging +${net.toFixed(2)} A`;
    document.getElementById('flowNet').style.color = 'var(--soc-high)';
  } else if (net < -0.1) {
    fa.textContent  = '←';
    fa2.textContent = '←';
    fa.className    = 'flow-arrow draining';
    fa2.className   = 'flow-arrow draining';
    document.getElementById('flowNet').textContent = `🔻 Draining ${Math.abs(net).toFixed(2)} A`;
    document.getElementById('flowNet').style.color = 'var(--load)';
  } else {
    fa.textContent  = '⇌';
    fa2.textContent = '⇌';
    fa.className    = 'flow-arrow';
    fa2.className   = 'flow-arrow';
    document.getElementById('flowNet').textContent = '⚖️ Balanced';
    document.getElementById('flowNet').style.color = 'var(--muted)';
  }

  // Timestamp
  const now = new Date();
  document.getElementById('timestamp').textContent =
    'Last update: ' + now.toLocaleTimeString('en-GB');
}

// Watchdog: if no message in 10s, mark offline
setInterval(() => {
  if (connected && Date.now() - lastMsgTime > 10000) {
    setStatus('offline');
  }
}, 3000);

connect();
</script>
</body>
</html>
